name: Bundle Skill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "enslopify/**"
      - ".github/workflows/bundle-skill.yml"
      - ".gitignore"
      - "README.md"
  pull_request:
    paths:
      - "enslopify/**"
      - ".github/workflows/bundle-skill.yml"
      - ".gitignore"
      - "README.md"

permissions:
  contents: read

env:
  SKILL_RELEASE: "1.0.0"
  ENSLOPIFY_RELEASE: "1.0"

jobs:
  bundle:
    name: Validate and Bundle Skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate skill structure
        run: |
          set -euo pipefail
          skill_file="enslopify/SKILL.md"
          metadata_file="enslopify/agents/openai.yaml"
          pinned_source="peteromallet/enslopify.git@v${ENSLOPIFY_RELEASE}"
          test -f "$skill_file"
          test -f "$metadata_file"
          test -f "enslopify/references/recovery.md"
          test -z "$(git ls-files 'enslopify-code-health-auditor/**')"
          test ! -d enslopify/scripts
          test "$(sed -n '2p' "$skill_file")" = "name: enslopify"
          test "$(grep -Fc "$pinned_source" "$skill_file")" = "2"
          grep -Fq 'Use $enslopify' "$metadata_file"
          grep -Fq "<!-- enslopify-skill-release: ${SKILL_RELEASE} -->" "$skill_file"
          grep -Fq "<!-- upstream-enslopify-release: ${ENSLOPIFY_RELEASE} -->" "$skill_file"

      - name: Bundle skill
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/enslopify-skill-v${SKILL_RELEASE}.zip" enslopify \
            -x "*/.DS_Store" \
            -x "*/.enslopify/*" \
            -x "*/runs/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc"

      - name: Verify bundle contents
        run: |
          set -euo pipefail
          bundle="dist/enslopify-skill-v${SKILL_RELEASE}.zip"
          unzip -t "$bundle"
          unzip -Z1 "$bundle" | grep -Fxq 'enslopify/SKILL.md'
          unzip -Z1 "$bundle" | grep -Fxq 'enslopify/agents/openai.yaml'
          unzip -Z1 "$bundle" | grep -Fxq 'enslopify/references/recovery.md'
          if unzip -Z1 "$bundle" | grep -Eq '(^|/)(runs|scripts|\.enslopify|__pycache__)(/|$)|\.pyc$'; then
            echo "Bundle contains a forbidden runtime or legacy path."
            exit 1
          fi
          unzip -l "$bundle"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: enslopify-skill-v${{ env.SKILL_RELEASE }}
          path: dist/enslopify-skill-v${{ env.SKILL_RELEASE }}.zip
          if-no-files-found: error
          retention-days: 14
